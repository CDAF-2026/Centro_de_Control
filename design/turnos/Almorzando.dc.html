<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #f4f6f5; color: #16181a;
           font-family: "Open Sans", system-ui, -apple-system, sans-serif; }
    a { color: #5b6300; } a:hover { color: #46530a; }
    .h { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    .n { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f4f6f5; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(255,255,255,0.8); border-bottom: 1px solid #e4e8ea;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181a" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: rgba(212,225,87,0.15); box-shadow: inset 0 0 0 1px rgba(212,225,87,0.25);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#37474f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </span>
      <span class="h" style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Mi turno</span>
    </div>
    <span style="margin-left: auto; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #d4e157; color: #1a1c1e; font-size: 11px; font-weight: 700;">CA</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 16px 64px;">

    <!-- En pausa el marcador se apaga: mismo bloque, pero sin lima y sin
         destello. Que el color se vaya es la señal de que el turno no corre. -->
    <div style="position: relative; overflow: hidden; background: #2b3134; border-radius: 18px; padding: 30px 24px 24px; box-shadow: 0 10px 30px -10px rgba(22,24,26,0.16), 0 4px 10px -4px rgba(22,24,26,0.07);">

      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2b53d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V2"/><path d="M5.5 11v11"/><path d="M20 2a4 4 0 0 0-4 4v7h4"/><path d="M20 13v9"/></svg>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(240,241,241,0.55);">Turno en pausa</span>
      </div>

      <div class="h" style="margin-top: 16px; font-size: 44px; line-height: 44px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.02em; color: #f2b53d;">Estás<br>almorzando</div>
      <div class="n" style="margin-top: 12px; font-size: 15px; color: rgba(240,241,241,0.6);">Saliste a las 12:30 p. m.</div>

      <button style="margin-top: 28px; width: 100%; height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 11px; background: #d4e157; color: #1a1c1e; font-family: Montserrat, sans-serif; font-size: 17px; font-weight: 800; cursor: pointer;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1a1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Regresé del almuerzo
      </button>
    </div>

    <!-- Por qué no está "Cerrar turno": dicho, no escondido -->
    <div style="margin-top: 18px; display: flex; gap: 12px; padding: 16px 18px; background: #ffffff; border-radius: 12px; box-shadow: 0 1px 2px -1px rgba(22,24,26,0.06), inset 0 0 0 1px rgba(242,181,61,0.35);">
      <svg style="flex-shrink: 0; margin-top: 1px;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a5600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div style="font-size: 13px; line-height: 19px; color: #16181a;">
        <span style="font-weight: 600;">Primero marca tu regreso.</span>
        <span style="color: #5c6b73;"> No se puede cerrar el turno con el almuerzo abierto: no sabríamos cuánto descontar.</span>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
