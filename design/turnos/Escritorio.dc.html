<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #f4f6f5; color: #16181a;
           font-family: "Open Sans", system-ui, -apple-system, sans-serif; }
    a { color: #5b6300; } a:hover { color: #46530a; }
    .h { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    .n { font-variant-numeric: tabular-nums; }
    .nav { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px;
           font-size: 14px; color: rgba(240,241,241,0.7); }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; display: flex; background: #f4f6f5; overflow: hidden;">

  <!-- Barra lateral de la app -->
  <div style="width: 256px; flex-shrink: 0; background: #1a1c1e; border-right: 1px solid #2f3131; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 20px;">
      <span style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; background: rgba(212,225,87,0.1); box-shadow: inset 0 0 0 1px rgba(212,225,87,0.25); color: #d4e157; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 800;">AF</span>
      <div style="min-width: 0; line-height: 1.25;">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #d4e157;">Centro de Control</div>
        <div style="font-size: 12px; color: rgba(240,241,241,0.55);">Alejandro Falla</div>
      </div>
    </div>

    <div style="padding: 8px 20px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,241,241,0.4);">Menú</div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px;">
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(240,241,241,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Clientes</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(240,241,241,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>Academias</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(240,241,241,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Paquetes</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(240,241,241,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Clases</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(240,241,241,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0z"/></svg>Eventos</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(240,241,241,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v6h6"/></svg>Notas</div>

      <!-- Activo: riel lima + fondo charcoal, como el resto de la app -->
      <div class="nav" style="position: relative; background: rgba(55,71,79,0.7); color: #ffffff; font-weight: 600;">
        <span style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 20px; border-radius: 0 999px 999px 0; background: #d4e157;"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4e157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Mi turno
      </div>
    </div>

    <div style="margin-top: auto; padding: 12px; border-top: 1px solid #2f3131;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px;">
        <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #d4e157; color: #1a1c1e; font-size: 11px; font-weight: 700;">CA</span>
        <span style="min-width: 0; line-height: 1.25;">
          <span style="display: block; font-size: 14px; font-weight: 500; color: #f0f1f1;">Camila Arboleda</span>
          <span style="display: block; font-size: 12px; color: rgba(240,241,241,0.5);">Recepción</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Columna principal -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 32px; background: rgba(255,255,255,0.8); border-bottom: 1px solid #e4e8ea;">
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: rgba(212,225,87,0.15); box-shadow: inset 0 0 0 1px rgba(212,225,87,0.25);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#37474f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </span>
      <span class="h" style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Mi turno</span>
    </div>

    <!-- En escritorio la pantalla hace lo MISMO: marcar. Sin registro que
         mostrar, la tarjeta no se estira a todo lo ancho — se centra, del ancho
         de una tarjeta, para que el botón siga leyéndose como un botón. -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px;">
      <div style="width: 440px;">

        <div style="position: relative; overflow: hidden; background: #1a1c1e; border-radius: 18px; padding: 32px 28px 26px; box-shadow: 0 10px 30px -10px rgba(22,24,26,0.16), 0 4px 10px -4px rgba(22,24,26,0.07);">
          <div style="position: absolute; top: -90px; right: -70px; width: 260px; height: 260px; border-radius: 999px; background: rgba(212,225,87,0.16); filter: blur(56px);"></div>

          <div style="position: relative; display: flex; align-items: center; gap: 9px;">
            <span style="width: 9px; height: 9px; border-radius: 999px; background: #d4e157; box-shadow: 0 0 0 4px rgba(212,225,87,0.2);"></span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(240,241,241,0.55);">Turno abierto</span>
          </div>

          <div class="h" style="position: relative; margin-top: 16px; font-size: 46px; line-height: 46px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.02em; color: #d4e157;">Estás<br>en turno</div>
          <div class="n" style="position: relative; margin-top: 12px; font-size: 15px; color: rgba(240,241,241,0.6);">Entraste a las 7:02 a. m.</div>

          <div style="position: relative; margin-top: 28px; display: flex; flex-direction: column; gap: 10px;">
            <button style="width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 11px; background: #d4e157; color: #1a1c1e; font-family: Montserrat, sans-serif; font-size: 17px; font-weight: 800; cursor: pointer;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1a1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.2"/></svg>
              Cerrar turno
            </button>
            <button style="width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 11px; border: 1px solid rgba(240,241,241,0.22); background: transparent; color: #f0f1f1; font-family: Montserrat, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f0f1f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V2"/><path d="M5.5 11v11"/><path d="M20 2a4 4 0 0 0-4 4v7h4"/><path d="M20 13v9"/></svg>
              Salgo a almorzar
            </button>
          </div>
        </div>

        <div style="margin-top: 18px; text-align: center; font-size: 13px; line-height: 19px; color: #5c6b73;">Al cerrar se abre la cámara para tu foto de salida.</div>

      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
