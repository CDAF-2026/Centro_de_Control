<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #1a1c1e; color: #f0f1f1;
           font-family: "Open Sans", system-ui, -apple-system, sans-serif; }
    a { color: #d4e157; } a:hover { color: #c2cf47; }
    .h { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    .n { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!-- La cámara se toma la pantalla completa: en ese momento no hay nada más que
     hacer, y el visor pequeño dentro de una tarjeta se ve de juguete. -->
<div style="width: 390px; min-height: 844px; background: #1a1c1e; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px;">
    <button style="display: flex; align-items: center; gap: 6px; padding: 0; border: none; background: transparent; color: rgba(240,241,241,0.7); font-family: inherit; font-size: 14px; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Cancelar
    </button>
    <span style="margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #d4e157;">Foto de entrada</span>
  </div>

  <!-- Visor -->
  <div style="position: relative; margin: 4px 16px 0; height: 470px; border-radius: 18px; overflow: hidden; background: linear-gradient(160deg, #33393c 0%, #23282b 55%, #1c2022 100%);">

    <!-- Guía para el rostro: un óvalo, no un cuadro, para que se entienda sin leer -->
    <div style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 208px; height: 268px; border-radius: 50%; border: 2px dashed rgba(212,225,87,0.55);"></div>

    <!-- Silueta de referencia, para que la maqueta se lea -->
    <svg style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);" width="150" height="200" viewBox="0 0 150 200" fill="none">
      <circle cx="75" cy="70" r="42" fill="rgba(240,241,241,0.10)"/>
      <path d="M8 200c0-40 30-66 67-66s67 26 67 66z" fill="rgba(240,241,241,0.10)"/>
    </svg>

    <div style="position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 13px; color: rgba(240,241,241,0.75);">Centra tu cara en el óvalo</div>
  </div>

  <!-- Disparador -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 34px 16px 0;">
    <button style="width: 86px; height: 86px; border-radius: 999px; border: 4px solid rgba(212,225,87,0.3); background: #d4e157; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 40px -6px rgba(212,225,87,0.45);">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1a1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.2"/></svg>
    </button>
    <div class="h" style="font-size: 15px; font-weight: 600; color: rgba(240,241,241,0.9);">Toca para tomar la foto</div>
    <div style="max-width: 250px; text-align: center; font-size: 12px; line-height: 18px; color: rgba(240,241,241,0.45);">Tu hora de entrada queda registrada al tomarla. La foto se guarda 45 días y solo la ve el administrador.</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
