<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #1a1c1e; color: #f0f1f1;
           font-family: "Open Sans", system-ui, -apple-system, sans-serif; }
    a { color: #d4e157; } a:hover { color: #c2cf47; }
    .h { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    .n { font-variant-numeric: tabular-nums; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em;
               text-transform: uppercase; color: rgba(240,241,241,.45); }
    .marco { width: 1280px; height: 800px; background: #1a1c1e; position: relative;
             overflow: hidden; display: flex; flex-direction: column; }
    .brillo { position: absolute; top: -160px; right: -120px; width: 520px; height: 520px;
              border-radius: 999px; background: rgba(212,225,87,.10); filter: blur(90px); }
    .barra { position: relative; display: flex; align-items: flex-start;
             justify-content: space-between; padding: 32px 40px 0; }
    .lima { color: #d4e157; }
  </style>
</helmet>

<!-- La cámara del PC. El visor va grande y centrado: la webcam está encima de
     la pantalla, así que uno mira al frente de forma natural. -->
<div class="marco">
  <div class="brillo"></div>

  <div class="barra">
    <button style="display: flex; align-items: center; gap: 8px; padding: 0; border: none; background: transparent; color: rgba(240,241,241,.55); font: 400 16px/1 'Open Sans'; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Cancelar
    </button>
    <div class="eyebrow lima">Foto de salida · Juan Fernando</div>
  </div>

  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 0 60px 30px;">
    <div style="position: relative; width: 400px; height: 400px; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, #33393c 0%, #23282b 55%, #1c2022 100%);">
      <div style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 200px; height: 258px; border-radius: 50%; border: 2px dashed rgba(212,225,87,.55);"></div>
      <svg style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);" width="146" height="196" viewBox="0 0 150 200" fill="none">
        <circle cx="75" cy="70" r="42" fill="rgba(240,241,241,.10)"/>
        <path d="M8 200c0-40 30-66 67-66s67 26 67 66z" fill="rgba(240,241,241,.10)"/>
      </svg>
    </div>

    <div style="width: 330px;">
      <div class="h" style="font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -.02em;">Mira a la cámara</div>
      <div style="margin-top: 12px; font-size: 16px; line-height: 24px; color: rgba(240,241,241,.55);">Centra tu cara en el óvalo y toca el botón. Tu hora de salida queda registrada al tomarla.</div>

      <button style="margin-top: 30px; width: 100%; height: 84px; display: flex; align-items: center; justify-content: center; gap: 12px; border: none; border-radius: 16px; background: #d4e157; color: #1a1c1e; font-family: Montserrat, sans-serif; font-size: 22px; font-weight: 800; cursor: pointer; box-shadow: 0 0 50px -10px rgba(212,225,87,.5);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1a1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.2"/></svg>
        Tomar la foto
      </button>

      <div style="margin-top: 18px; font-size: 13px; line-height: 20px; color: rgba(240,241,241,.35);">La foto se guarda 45 días y solo la ve el administrador.</div>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
