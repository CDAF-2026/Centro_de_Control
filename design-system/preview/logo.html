<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: var(--cdaf-surface-gray); padding: 18px 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-items: stretch; }
  .lockup {
    aspect-ratio: 1 / 1;
    display: grid; place-items: center;
    border-radius: 8px;
    padding: 10px;
  }
  .lockup img { width: 92%; height: 92%; object-fit: contain; display: block; }
  .lockup--light  { background: var(--cdaf-athletic-white); border: 1px solid var(--cdaf-outline-variant); }
  .lockup--gray   { background: var(--cdaf-surface-gray); border: 1px solid var(--cdaf-court-charcoal); }
  .lockup--dark   { background: var(--cdaf-stadium-black); }
  .lockup--dark img {
    width: 84%; height: 84%; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 2px var(--cdaf-impact-lime);
  }
  .cap {
    margin-top: 6px;
    font-family: var(--font-body); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg2);
    text-align: center;
  }
  .col { display: flex; flex-direction: column; }
</style>
</head>
<body>
  <div class="row">
    <div class="col">
      <div class="lockup lockup--light"><img src="../assets/logo-primary.png" alt="Logo CDAF"></div>
      <div class="cap">On white · primary</div>
    </div>
    <div class="col">
      <div class="lockup lockup--gray"><img src="../assets/logo-primary.png" alt="Logo CDAF"></div>
      <div class="cap">On surface gray</div>
    </div>
    <div class="col">
      <div class="lockup lockup--dark"><img src="../assets/logo-primary.png" alt="Logo CDAF"></div>
      <div class="cap">On dark · circle crop + lime ring</div>
    </div>
  </div>
</body>
</html>
