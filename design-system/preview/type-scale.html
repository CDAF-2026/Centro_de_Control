<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: var(--cdaf-surface-gray); padding: 18px 20px; }
  .row { display: grid; grid-template-columns: 80px 1fr 130px; gap: 14px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--cdaf-outline-variant); }
  .row:last-child { border-bottom: 0; }
  .role { font-family: var(--font-body); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg2); }
  .specimen { color: var(--cdaf-stadium-black); margin: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); text-align: right; }
  .m { font-family: 'Montserrat', sans-serif; font-style: italic; text-transform: uppercase; font-weight: 900; }
  .m-h { font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-weight: 800; }
  .os { font-family: 'Open Sans', sans-serif; }
  .os-b { font-family: 'Open Sans', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row"><div class="role">Display</div><div class="specimen m" style="font-size:40px;line-height:1;letter-spacing:-0.02em">Padel &amp; Tenis</div><div class="meta">48/52 · 900i</div></div>
  <div class="row"><div class="role">H1</div><div class="specimen m" style="font-size:28px;line-height:1.1">Compromiso</div><div class="meta">32/40 · 800i</div></div>
  <div class="row"><div class="role">H2</div><div class="specimen m-h" style="font-size:22px;line-height:1.2">Programas</div><div class="meta">24/32 · 700</div></div>
  <div class="row"><div class="role">H3</div><div class="specimen m-h" style="font-size:18px;line-height:1.3">Staff</div><div class="meta">20/28 · 700</div></div>
  <div class="row"><div class="role">Body lg</div><div class="specimen os" style="font-size:16px;line-height:1.5">Ofrecemos torneos para todos los niveles.</div><div class="meta">18/28 · 400</div></div>
  <div class="row"><div class="role">Body md</div><div class="specimen os" style="font-size:14px;line-height:1.5">Clean, neutral, highly readable.</div><div class="meta">16/24 · 400</div></div>
  <div class="row"><div class="role">Label</div><div class="specimen os-b" style="font-size:12px">VER PERFIL</div><div class="meta">14/20 · 700</div></div>
</body>
</html>
