<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: var(--cdaf-stadium-black); padding: 0; }
  .frame { position: relative; height: 220px; overflow: hidden; }
  .photo {
    position: absolute; inset: 0;
    background-image: url(https://centrodeportivoaf.com/wp-content/uploads/2024/01/ACADEMIA-33.jpg);
    background-size: cover; background-position: center;
    filter: contrast(1.05) brightness(0.55) saturate(1.05);
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(26,28,30,0.2), rgba(26,28,30,0.7));
  }
  .stencils {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
    text-align: center;
  }
  .word {
    font-family: 'Montserrat'; font-weight: 900; font-style: italic; text-transform: uppercase;
    font-size: 64px; line-height: 0.9; letter-spacing: -0.02em;
    color: transparent;
    -webkit-text-stroke: 2px var(--cdaf-impact-lime);
  }
  .word.solid { color: var(--cdaf-impact-lime); -webkit-text-stroke: 0; }
  .word.white { color: #fff; -webkit-text-stroke: 0; }
  .pill {
    position: absolute; top: 14px; right: 14px;
    background: var(--cdaf-impact-lime); color: var(--cdaf-stadium-black);
    font-family: 'Montserrat'; font-weight: 900; font-style: italic; text-transform: uppercase;
    font-size: 12px; padding: 6px 12px; border-radius: 9999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #BA1A1A; }
  .eyebrow {
    position: absolute; left: 14px; top: 14px;
    font-family: 'Open Sans'; font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--cdaf-impact-lime);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="photo"></div>
    <div class="scrim"></div>
    <div class="eyebrow">Valores · Brand stencil</div>
    <span class="pill"><span class="dot"></span>¡En Vivo!</span>
    <div class="stencils">
      <div class="word">RESPETO</div>
      <div class="word solid">COMPROMISO</div>
      <div class="word">DISCIPLINA</div>
    </div>
  </div>
</body>
</html>
