<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: var(--cdaf-surface-gray); padding: 24px 20px; }
  .display {
    font-family: var(--font-display);
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    color: var(--cdaf-stadium-black);
    font-size: 76px;
    line-height: 0.92;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .display .accent { color: var(--cdaf-impact-lime); -webkit-text-stroke: 1px var(--cdaf-stadium-black); }
  .sub {
    margin-top: 14px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--fg2);
    line-height: 1.5;
  }
  .specimen-meta {
    display: flex; gap: 16px; margin-top: 16px;
    font-family: var(--font-mono); font-size: 11px; color: var(--fg2);
  }
  .specimen-meta span strong { color: var(--cdaf-stadium-black); }
</style>
</head>
<body>
  <h1 class="display">COMPROMISO<br><span class="accent">CON&nbsp;EL&nbsp;JUEGO</span></h1>
  <div class="specimen-meta">
    <span><strong>Family</strong> Montserrat</span>
    <span><strong>Weight</strong> 900 Black Italic</span>
    <span><strong>Case</strong> UPPER</span>
    <span><strong>Track</strong> -0.03em</span>
  </div>
  <div class="sub">Display treatment for hero titles and brand-level messaging. Italic = velocity. Uppercase = authority.</div>
</body>
</html>
